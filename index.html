<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeppIT OÜ</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%94%A5</text></svg>">
  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #0f0f10;
      color: #f5f5f5;
    }
    main {
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    p {
      color: #999;
    }
    video {
      position: fixed;
      width: 160px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <main>
    <h1>LeppIT OÜ</h1>
    <p>Site coming soon.</p>
  </main>
  <video src="burn.mp4" autoplay loop muted playsinline width="160"></video>
  <script>
    const video = document.querySelector("video");
    const w = 160;
    const h = w * (video.videoHeight / video.videoWidth || 9 / 16);
    const maxX = Math.max(0, window.innerWidth - w);
    const maxY = Math.max(0, window.innerHeight - h);
    video.style.left = Math.random() * maxX + "px";
    video.style.top = Math.random() * maxY + "px";
  </script>
</body>
</html>
